[package]
name = "macabout"
version = "1.0.10"
edition = "2024"
publish = false
description = "About This Computer: a system information dialog for Linux"
rust-version = "1.97"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "system_fonts", "wayland", "x11"] }
egui_system_font_provider = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1.13.2"
resvg = { version = "0.50", default-features = false, features = ["system-fonts", "text"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = true
codegen-units = 1
strip = true
