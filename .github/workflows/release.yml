name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    # Ubuntu 22.04 is the oldest supported base (Zorin 17): the binary needs its glibc or newer.
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: tag $GITHUB_REF_NAME does not match Cargo.toml version $PKG_VERSION"
            echo "Update the version (CI checks all three files agree) before tagging."
            exit 1
          fi
          echo "Version: $PKG_VERSION"

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked --release

      - name: Build .deb
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: build/macabout_*_${{ matrix.arch }}.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # The `secrets` context is not available in a step-level `if`, so surface
    # it as an env var to let the AUR publish step skip itself until the
    # secrets are configured.
    env:
      AUR_KEY_SET: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: build
          merge-multiple: true

      - name: Stamp PKGBUILD with version and source checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          curl -sSL --fail "$TARBALL" -o source.tar.gz
          SHA="$(sha256sum source.tar.gz | cut -d ' ' -f 1)"
          rm source.tar.gz
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" arch/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" arch/PKGBUILD
          echo "--- arch/PKGBUILD ---"
          cat arch/PKGBUILD

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/macabout_*_amd64.deb
            build/macabout_*_arm64.deb
            arch/PKGBUILD
            install.sh
          generate_release_notes: true
          body: |
            ## Quick Install (One-Line)

            Detects your distro and installs the right package. Run it as your
            normal user — it calls `sudo` itself where it needs to.

            ```bash
            curl -sSL https://pandawood.github.io/macabout/install.sh | bash
            ```

            ## Manual Install

            **Debian / Ubuntu / Mint / Zorin**

            Download the `.deb` for your machine (`amd64` for Intel/AMD,
            `arm64` for ARM), then:

            ```bash
            sudo apt install ./macabout_*_amd64.deb
            ```

            Requires `pciutils` (pulled in automatically).

            **Arch / CachyOS / Manjaro / EndeavourOS**

            Using the `PKGBUILD` attached below:

            ```bash
            makepkg -si
            ```

            Builds from source with `cargo`; requires `pciutils` (pulled in
            automatically).
            An AUR package is planned, at which point `paru -S macabout` will
            also work.

      - name: Publish to the AUR
        if: ${{ env.AUR_KEY_SET == 'true' }}
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: macabout
          pkgbuild: ./arch/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Prepare GitHub Pages
        run: |
          cp install.sh docs/install.sh
          cp arch/PKGBUILD docs/PKGBUILD
          cp -r img docs/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: false
