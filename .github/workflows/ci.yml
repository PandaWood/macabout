name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version is in sync across packaging files
        run: |
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          deb=$(sed -n 's/^Version: //p' debian/DEBIAN/control)
          arch=$(sed -n 's/^pkgver=//p' arch/PKGBUILD)
          echo "  Cargo.toml: $cargo"
          echo "  debian/DEBIAN/control: $deb"
          echo "  arch/PKGBUILD: $arch"
          if [ "$cargo" != "$deb" ] || [ "$cargo" != "$arch" ]; then
            echo "Error: version mismatch. Update all three files to the same value."
            exit 1
          fi

      - name: Validate GPU lookup JSON
        run: jq -e 'type == "object"' data/gpu_lookup.json > /dev/null

  rust:
    # Ubuntu 22.04 is the oldest supported base (Zorin 17): its glibc is what the release builds against.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

      - name: Build the .deb
        run: ./build.sh
